[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "s3keepass"           # repo = pip = import name
version = "0.1.0"
description = "KeePass vaults (.kdbx) on your own S3, opened in a web UI served by a Lambda Function URL; decrypted only in the browser, ≈ $0 when idle."
readme = "README.md"
requires-python = ">=3.9"
license = { text = "MIT" }
authors = [{ name = "Frank Zhang" }]
keywords = ["serverless", "aws", "lambda", "s3", "keepass", "kdbx", "password-manager"]
classifiers = [
  "Development Status :: 3 - Alpha",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: MIT License",
  "Programming Language :: Python :: 3",
]
dependencies = []  # standard library only

[project.urls]
Homepage = "https://github.com/cloudformer/s3keepass"
IdleFree = "https://cloudformer.github.io/"
Repository = "https://github.com/cloudformer/s3keepass"
Deploy = "https://github.com/cloudformer/s3keepass#quick-start"
Compatibility = "https://github.com/cloudformer/s3keepass/blob/main/tests/compat/REPORT.md"
Changelog = "https://github.com/cloudformer/s3keepass/blob/main/CHANGELOG.md"
Issues = "https://github.com/cloudformer/s3keepass/issues"

[tool.setuptools]
packages = ["s3keepass"]     # rename the directory client/project/ to client/s3keepass/
