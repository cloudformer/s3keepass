<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 560" width="1100" height="560"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="gCompute" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#F58534"/><stop offset="1" stop-color="#C7511F"/>
    </linearGradient>
    <linearGradient id="gStorage" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#6CAE3E"/><stop offset="1" stop-color="#3F8624"/>
    </linearGradient>
    <linearGradient id="gConsole" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#8C4FFF"/><stop offset="1" stop-color="#5B3BC8"/>
    </linearGradient>
    <linearGradient id="gKms" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#E7157B"/><stop offset="1" stop-color="#A3124F"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0,0 L10,5 L0,10 z" fill="#CBD5E1"/>
    </marker>
    <style>
      .group  { fill: none; stroke: #94A3B8; stroke-width: 1.3; }
      .gtitle { font-size: 15px; font-weight: 600; fill: #CBD5E1; }
      .label  { font-size: 12.5px; font-weight: 600; fill: #F1F5F9; }
      .sub    { font-size: 11px; fill: #94A3B8; }
      .edge   { fill: none; stroke: #CBD5E1; stroke-width: 1.8; }
      .callout      { fill: #F2443B; }
      .callout-text { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .step   { font-size: 11.5px; fill: #E2E8F0; }
      .glyph  { fill: none; stroke: #FFFFFF; stroke-width: 2.6; stroke-linejoin: round; stroke-linecap: round; }
    </style>
  </defs>

  <rect width="1100" height="560" rx="18" fill="#0F172A"/>

  <!-- ====================== your devices ====================== -->
  <rect x="30" y="56" width="270" height="420" rx="10" class="group" stroke-dasharray="6 5"/>
  <text x="165" y="84" text-anchor="middle" class="gtitle">Your devices</text>

  <!-- browser: the s3keepass UI -->
  <g transform="translate(122,108)">
    <rect width="86" height="86" rx="10" fill="url(#gConsole)"/>
    <rect x="13" y="16" width="60" height="8" rx="2" fill="#FFFFFF" opacity="0.95"/>
    <rect x="13" y="29" width="18" height="42" rx="3" fill="#FFFFFF" opacity="0.35"/>
    <rect x="34" y="29" width="39" height="42" rx="3" fill="#FFFFFF" opacity="0.22"/>
    <rect x="38" y="35" width="31" height="4.5" rx="2" fill="#FFFFFF"/>
    <rect x="38" y="44" width="31" height="4.5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <rect x="38" y="53" width="31" height="4.5" rx="2" fill="#FFFFFF" opacity="0.7"/>
    <text x="43" y="108" text-anchor="middle" class="label">Browser: s3keepass UI</text>
    <text x="43" y="124" text-anchor="middle" class="sub">groups · entries · generator</text>
  </g>
  <rect x="58" y="252" width="22" height="22" rx="4" class="callout"/><text x="69" y="268" text-anchor="middle" class="callout-text">2</text>
  <text x="88" y="262" class="step">master password + decryption</text>
  <text x="88" y="277" class="step">stay in the browser (KDBX 4:</text>
  <text x="88" y="292" class="step">Argon2id + AES-256, kdbxweb)</text>

  <!-- KeePassXC / mobile -->
  <g transform="translate(122,330)">
    <rect width="86" height="86" rx="10" fill="#334155"/>
    <rect x="22" y="34" width="42" height="34" rx="5" class="glyph"/>
    <path d="M31 34 v-8 a12 12 0 0 1 24 0 v8" class="glyph"/>
    <circle cx="43" cy="49" r="4" fill="#FFFFFF"/><path d="M43 52 v7" class="glyph" stroke-width="2.4"/>
    <text x="43" y="108" text-anchor="middle" class="label">KeePassXC · mobile apps</text>
    <text x="43" y="124" text-anchor="middle" class="sub">open the same .kdbx (download)</text>
  </g>

  <!-- devices -> endpoint -->
  <path d="M300 160 L 418 160" class="edge" marker-end="url(#arrow)"/>
  <rect x="304" y="126" width="110" height="24" rx="5" class="callout"/>
  <text x="359" y="143" text-anchor="middle" class="callout-text">1  HTTPS · Basic</text>
  <path d="M300 372 L 418 372" class="edge" stroke-dasharray="5 4" marker-start="url(#arrow)"/>
  <text x="359" y="364" text-anchor="middle" class="sub">⤓ .kdbx</text>

  <!-- ====================== s3keepass ====================== -->
  <rect x="360" y="40" width="710" height="490" rx="12" class="group" stroke="#CBD5E1" stroke-width="1.6"/>
  <text x="380" y="70" class="gtitle" font-size="18" fill="#F8FAFC">s3keepass: KeePass vaults on S3, opened in a web UI</text>
  <text x="380" y="88" class="sub">Lambda Function URL · S3 (versioned, SSE-KMS) · ≈ $0 when idle</text>

  <!-- the Lambda -->
  <rect x="400" y="110" width="400" height="300" rx="9" class="group"/>
  <text x="600" y="134" text-anchor="middle" class="gtitle" font-size="13">Endpoint</text>
  <g transform="translate(430,160)">
    <rect width="86" height="86" rx="10" fill="url(#gCompute)"/>
    <text x="43" y="62" text-anchor="middle" font-size="50" font-weight="700" fill="#FFFFFF">λ</text>
    <text x="43" y="108" text-anchor="middle" class="label">Lambda</text>
    <text x="43" y="124" text-anchor="middle" class="sub">serves the UI</text>
    <text x="43" y="138" text-anchor="middle" class="sub">moves ciphertext only</text>
  </g>
  <g transform="translate(540,160)">
    <text x="0" y="16" class="step">list keepass/*.kdbx (the "folder")</text>
    <text x="0" y="34" class="step">get · versions · delete (If-Match)</text>
    <rect y="52" width="22" height="22" rx="4" class="callout"/><text x="11" y="68" text-anchor="middle" class="callout-text">3</text>
    <text x="30" y="62" class="step">save = PUT If-Match &lt;ETag read&gt;:</text>
    <text x="30" y="77" class="step">a second tab or device is refused</text>
    <text x="30" y="92" class="step">(412), never silently overwritten</text>
    <text x="0" y="122" class="step">never sees a master password</text>
    <text x="0" y="137" class="step">or a decrypted entry</text>
  </g>

  <!-- storage -->
  <rect x="830" y="110" width="210" height="300" rx="9" class="group"/>
  <text x="935" y="134" text-anchor="middle" class="gtitle" font-size="13">Storage</text>
  <g transform="translate(892,160)">
    <rect width="86" height="86" rx="10" fill="url(#gStorage)"/>
    <path d="M20 22 h46 l-6 46 h-34 z" class="glyph" stroke-width="2.8"/>
    <ellipse cx="43" cy="22" rx="23" ry="6" class="glyph" stroke-width="2.4"/>
    <text x="43" y="108" text-anchor="middle" class="label">S3: keepass/</text>
    <text x="43" y="124" text-anchor="middle" class="sub">库1.kdbx · 库2.kdbx · …</text>
    <text x="43" y="138" text-anchor="middle" class="sub">one object = one vault</text>
  </g>
  <rect x="846" y="318" width="22" height="22" rx="4" class="callout"/><text x="857" y="334" text-anchor="middle" class="callout-text">4</text>
  <text x="876" y="328" class="step">every save a version</text>
  <text x="876" y="343" class="step">(newest 100 kept)</text>
  <text x="876" y="364" class="step">SSE-KMS (aws/s3)</text>
  <text x="876" y="379" class="step">TLS only · private</text>
  <path d="M800 203 L 890 203" class="edge" marker-end="url(#arrow)" marker-start="url(#arrow)"/>

  <!-- KMS -->
  <g transform="translate(450,436)">
    <rect width="54" height="54" rx="8" fill="url(#gKms)"/>
    <circle cx="20" cy="27" r="8" class="glyph" stroke-width="2.4"/>
    <path d="M28 27 h16 M38 27 v7 M44 27 v5" class="glyph" stroke-width="2.4"/>
  </g>
  <text x="516" y="458" class="label">KMS aws/s3 key</text>
  <text x="516" y="474" class="sub">AWS-managed, free · S3 encrypts every object at rest</text>
  <path d="M935 412 L 935 452 L 822 452" class="edge" stroke-dasharray="5 4"/>

  <text x="715" y="512" text-anchor="middle" class="sub">Idle: no instance, no database, no fee — a few KB in S3. A vault is a standard KeePass file you can always take away.</text>
</svg>
