<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 700" width="1100" height="700"
     font-family="-apple-system, 'Segoe UI', Helvetica, Arial, sans-serif">
  <defs>
    <style>
      .win   { fill: #0F1620; stroke: #26323B; stroke-width: 1.4; }
      .bar   { fill: #0F1620; }
      .panel { fill: #141C24; stroke: #26323B; stroke-width: 1.2; }
      .rowln { fill: #141C24; stroke: #26323B; stroke-width: 1; }
      .brand { font-size: 17px; font-weight: 700; fill: #E6ECF0; }
      .k     { font-size: 11px; fill: #8A97A3; }
      .chip  { fill: #1E2A32; stroke: #2B3843; stroke-width: 1; }
      .chipt { font: 12px ui-monospace, Menlo, monospace; fill: #CBD5E1; }
      .fold  { font-size: 14px; font-weight: 600; fill: #E6ECF0; }
      .hint  { font-size: 12px; fill: #8A97A3; }
      .mono  { font: 12px ui-monospace, Menlo, monospace; fill: #8A97A3; }
      .what  { font-size: 13px; fill: #E6ECF0; }
      .btn   { fill: #0A6E5C; }
      .btnt  { font-size: 12.5px; font-weight: 600; fill: #FFFFFF; }
      .btno  { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .btnot { font-size: 12px; fill: #CBD5E1; }
      .sel   { fill: #1B252C; stroke: #3A4752; stroke-width: 1; }
      .selt  { font-size: 12px; fill: #CBD5E1; }
      .badge { stroke-width: 1; }
      .brun  { fill: #11302B; stroke: #4FD1B0; } .brunt { font-size: 11.5px; font-weight: 600; fill: #4FD1B0; }
      .bpass { fill: #141C24; stroke: #4ADE80; } .bpasst { font-size: 11.5px; font-weight: 600; fill: #4ADE80; }
      .bwait { fill: #141C24; stroke: #3A4752; } .bwaitt { font-size: 11.5px; font-weight: 600; fill: #8A97A3; }
      .code  { fill: #0A0E13; }
      .cl    { font: 12px ui-monospace, Menlo, monospace; fill: #E2E8F0; }
      .cmark { font: 12px ui-monospace, Menlo, monospace; fill: #93C5FD; }
      .cok   { font: 12px ui-monospace, Menlo, monospace; fill: #6EE7B7; }
      .status{ fill: #0F1620; stroke: #26323B; stroke-width: 1; }
    </style>
  </defs>

  <rect width="1100" height="700" rx="14" fill="#0A0F14"/>
  <rect x="16" y="14" width="1068" height="672" rx="12" class="win"/>

  <!-- top bar -->
  <rect x="17" y="15" width="1066" height="46" rx="12" class="bar"/>
  <line x1="17" y1="61" x2="1083" y2="61" stroke="#26323B" stroke-width="1.2"/>
  <text x="40" y="44" class="brand">🔐 s3keepass</text>
  <rect x="166" y="40" width="112" height="16" rx="8" fill="#45200A" stroke="#F59E0B" stroke-width="1"/>
  <text x="175" y="52" style="font-size:11px;font-weight:700;fill:#F59E0B">🔓 Opened · demo</text>
  <text x="300" y="36" class="k">Endpoint</text>
  <rect x="300" y="41" width="214" height="14" rx="7" class="chip"/>
  <text x="308" y="52" class="chipt">s3keepass-...lambda-url.aws</text>
  <text x="544" y="36" class="k">Signed in</text>
  <rect x="544" y="41" width="60" height="14" rx="7" class="chip"/>
  <text x="552" y="52" class="chipt">admin</text>
  <rect x="990" y="30" width="78" height="22" rx="6" class="btno"/>
  <text x="1029" y="45" text-anchor="middle" class="btnot">Sign out</text>

  <!-- unlocked-vault accent (amber inset top) + pane dividers -->
  <rect x="17" y="62" width="1066" height="3" fill="#F59E0B" opacity="0.85"/>
  <rect x="17" y="65" width="272" height="588" fill="#121922"/>
  <line x1="289" y1="65" x2="289" y2="653" stroke="#26323B" stroke-width="1.2"/>
  <line x1="719" y1="65" x2="719" y2="653" stroke="#26323B" stroke-width="1.2"/>

  <!-- ===== left pane: groups tree ===== -->
  <text x="32" y="88" class="k">LIBRARY</text>
  <text x="30" y="110" class="what">🗃  Vaults</text>
  <rect x="20" y="118" width="258" height="24" rx="6" fill="#16263D" stroke="#2E4B73" stroke-width="1"/>
  <text x="30" y="135" class="selt">🔓  demo.kdbx</text>
  <rect x="196" y="122" width="62" height="16" rx="8" fill="#45200A" stroke="#F59E0B" stroke-width="1"/>
  <text x="227" y="134" text-anchor="middle" style="font-size:10px;font-weight:700;fill:#F59E0B">Opened</text>

  <line x1="24" y1="152" x2="278" y2="152" stroke="#26323B" stroke-width="1"/>
  <text x="32" y="172" class="k">GROUPS · INSIDE THIS FILE</text>
  <text x="26" y="196" class="fold">▾  demo</text>
  <text x="48" y="222" class="what">🗂  General</text>
  <text x="48" y="248" class="what">🗂  Email</text>
  <rect x="20" y="256" width="258" height="24" rx="6" fill="#16263D" stroke="#2E4B73" stroke-width="1"/>
  <text x="48" y="273" class="selt">🗂  Banking</text>
  <text x="242" y="273" class="hint">4</text>
  <text x="48" y="300" class="what">🗂  Servers</text>
  <text x="48" y="326" class="what">🗂  Social</text>
  <text x="48" y="352" class="hint">🗑  Recycle Bin</text>

  <!-- ===== middle pane: entries list ===== -->
  <text x="306" y="92" class="what" font-weight="600">Banking</text>
  <text x="372" y="92" class="hint">4 entries</text>
  <!-- action row -->
  <rect x="302" y="104" width="96" height="24" rx="6" class="btn"/>
  <text x="350" y="120" text-anchor="middle" class="btnt">＋ New entry</text>
  <rect x="404" y="104" width="96" height="24" rx="6" class="btno"/>
  <text x="452" y="120" text-anchor="middle" class="btnot">＋ New group</text>
  <rect x="506" y="104" width="52" height="24" rx="6" class="btno"/>
  <text x="532" y="120" text-anchor="middle" class="btnot">✎ Edit</text>
  <rect x="564" y="104" width="66" height="24" rx="6" class="btno"/>
  <text x="597" y="120" text-anchor="middle" class="btnot">🗑 Delete</text>
  <rect x="636" y="104" width="76" height="24" rx="6" fill="#45200A" stroke="#F59E0B" stroke-width="1"/>
  <text x="674" y="120" text-anchor="middle" style="font-size:12px;font-weight:600;fill:#F59E0B">🔒 Lock</text>

  <!-- table header -->
  <text x="314" y="150" class="k">Title</text>
  <text x="470" y="150" class="k">User name</text>
  <text x="576" y="150" class="k">URL</text>
  <text x="662" y="150" class="k">Modified</text>
  <line x1="296" y1="158" x2="714" y2="158" stroke="#26323B" stroke-width="1"/>

  <!-- selected row -->
  <rect x="296" y="162" width="418" height="30" fill="#16263D"/>
  <text x="314" y="182" class="what">🔑 ACME Bank</text>
  <text x="470" y="182" class="hint">j.appleseed</text>
  <text x="576" y="182" class="hint">acme-bank.example</text>
  <text x="662" y="182" class="mono" font-size="11">11/18/26</text>
  <!-- other rows -->
  <text x="314" y="212" class="what">🔑 Brokerage</text>
  <text x="470" y="212" class="hint">jappleseed</text>
  <text x="576" y="212" class="hint">invest.example.com</text>
  <text x="662" y="212" class="mono" font-size="11">10/02/26</text>
  <line x1="296" y1="222" x2="714" y2="222" stroke="#1E2A32" stroke-width="1"/>
  <text x="314" y="242" class="what">🔑 Credit Union</text>
  <text x="470" y="242" class="hint">j.appleseed</text>
  <text x="576" y="242" class="hint">mycu.example.org</text>
  <text x="662" y="242" class="mono" font-size="11">09/11/26</text>
  <line x1="296" y1="252" x2="714" y2="252" stroke="#1E2A32" stroke-width="1"/>
  <text x="314" y="272" class="what">🔑 PayPal demo</text>
  <text x="470" y="272" class="hint">demo@example.com</text>
  <text x="576" y="272" class="hint">paypal.example</text>
  <text x="662" y="272" class="mono" font-size="11">08/20/26</text>
  <line x1="296" y1="282" x2="714" y2="282" stroke="#1E2A32" stroke-width="1"/>

  <!-- ===== right pane: entry detail ===== -->
  <text x="736" y="98" style="font-size:19px;font-weight:700;fill:#E6ECF0">ACME Bank</text>
  <text x="736" y="118" class="hint">demo / Banking</text>

  <!-- User name -->
  <text x="736" y="150" class="k">USER NAME</text>
  <text x="736" y="170" class="what">j.appleseed</text>
  <text x="1058" y="170" text-anchor="end" class="mono">⧉</text>

  <!-- Password -->
  <text x="736" y="202" class="k">PASSWORD</text>
  <text x="736" y="222" class="mono" fill="#E2E8F0" letter-spacing="2">••••••••••••</text>
  <text x="1034" y="222" text-anchor="end" class="mono">👁</text>
  <text x="1058" y="222" text-anchor="end" class="mono">⧉</text>

  <!-- TOTP -->
  <text x="736" y="254" class="k">TOTP</text>
  <text x="736" y="274" class="cok" font-size="14">384 920</text>
  <text x="800" y="274" class="hint">· 27s</text>
  <text x="1058" y="274" text-anchor="end" class="mono">⧉</text>

  <!-- URL -->
  <text x="736" y="306" class="k">URL</text>
  <text x="736" y="326" class="cmark">https://acme-bank.example</text>
  <text x="1058" y="326" text-anchor="end" class="mono">⧉</text>

  <!-- Notes -->
  <text x="736" y="358" class="k">NOTES</text>
  <rect x="736" y="366" width="322" height="50" rx="6" fill="#0F1623" stroke="#26323B" stroke-width="1"/>
  <text x="748" y="386" class="hint">Demo entry — example data, not a real</text>
  <text x="748" y="404" class="hint">account.</text>

  <!-- actions -->
  <rect x="736" y="438" width="88" height="28" rx="6" class="btn"/>
  <text x="780" y="456" text-anchor="middle" class="btnt">✎ Edit</text>
  <rect x="832" y="438" width="88" height="28" rx="6" class="btno"/>
  <text x="876" y="456" text-anchor="middle" class="btnot">🗑 Delete</text>

  <!-- meta -->
  <line x1="736" y1="492" x2="1058" y2="492" stroke="#26323B" stroke-width="1"/>
  <text x="736" y="514" class="hint">Modified Nov 18, 2026, 9:42 AM</text>
  <text x="736" y="534" class="hint">Created Mar 3, 2025, 2:15 PM</text>
  <text x="736" y="554" class="hint">History: 2 earlier versions</text>

  <!-- status bar -->
  <rect x="17" y="654" width="1066" height="32" rx="12" class="status"/>
  <text x="40" y="674" class="mono" fill="#6EE7B7">[10:42:07] GET vaults/demo · 128 KB · 180 ms (server 42 ms) · s3</text>
  <text x="1060" y="674" text-anchor="end" class="mono">s3keepass</text>
</svg>
