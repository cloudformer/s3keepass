<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="referrer" content="no-referrer">
<title>s3keepass</title>
<link rel="icon" id="favicon" href="data:,">
<style>
:root {
  --bg: #f3f4f6; --panel: #ffffff; --panel2: #f9fafb; --line: #e5e7eb; --line2: #d1d5db;
  --text: #111827; --muted: #6b7280; --faint: #9ca3af;
  --accent: #2563eb; --accent-bg: #dbeafe; --accent-text: #1e40af;
  --ok: #059669; --err: #dc2626; --warn-bg: #fffbeb; --warn-line: #f59e0b;
  --bar: #1f2937; --bar-text: #f9fafb; --bar-muted: #9ca3af; --bar-vault: #78350f; --open: #f59e0b;
  --mono: ui-monospace, SFMono-Regular, Menlo, Consolas, monospace;
}
@media (prefers-color-scheme: dark) {
  :root {
    --bg: #0b0f17; --panel: #111827; --panel2: #0f1623; --line: #1f2937; --line2: #374151;
    --text: #e5e7eb; --muted: #9ca3af; --faint: #6b7280;
    --accent: #3b82f6; --accent-bg: #1e3a8a; --accent-text: #dbeafe;
    --warn-bg: #2a2110; --bar: #030712; --bar-vault: #451a03;
  }
}
* { margin: 0; padding: 0; box-sizing: border-box; }
html, body { height: 100%; }
body {
  font: 14px/1.45 -apple-system, BlinkMacSystemFont, 'Segoe UI', 'PingFang SC', 'Microsoft YaHei', sans-serif;
  background: var(--bg); color: var(--text); display: flex; flex-direction: column; overflow: hidden;
}
button { font: inherit; color: inherit; }
input, textarea { font: inherit; color: var(--text); background: var(--panel); }
[hidden] { display: none !important; }
a { color: var(--accent); }

/* ---- top bar ---- */
.bar { display: flex; align-items: center; gap: 10px; padding: 8px 14px; background: var(--bar); color: var(--bar-text);
  flex-wrap: wrap; min-height: 52px; }
.brand { font-weight: 700; font-size: 15px; display: flex; align-items: center; gap: 8px; cursor: pointer; }
.brand .logo { width: 30px; height: 30px; }
/* the safe: locked (still) › unlocking (the wheel turns) › unlocked (a green ✓ stays); the tab's icon follows */
/* three stacked layers — the safe, its wheel, the ✓ — so the moving ones are plain HTML transforms the GPU runs on its
   own: the wheel keeps turning while Argon2 holds the page's main thread */
.kp-logo { position: relative; display: inline-block; border-radius: 7px; background: #2b2d31; }
.kp-logo > * { position: absolute; inset: 4%; }
.kp-logo svg { display: block; width: 100%; height: 100%; }
.kp-wheel { transform-origin: 49% 47%; will-change: transform; }
.kp-check { transform-origin: 74% 74%; transform: scale(0); opacity: 0; will-change: transform, opacity;
  transition: transform .35s cubic-bezier(.3, 1.6, .5, 1), opacity .2s; }
.kp-logo[data-state=unlocking] .kp-wheel { animation: kp-rock 1.2s ease-in-out infinite; }
.kp-logo[data-state=open] .kp-check { transform: scale(1); opacity: 1; }
@keyframes kp-rock { 0%, 100% { transform: rotate(-70deg); } 50% { transform: rotate(80deg); } }
.kp-logo.shake { animation: kp-shake .35s ease-in-out; }
@keyframes kp-shake { 0%, 100% { transform: translateX(0); } 25% { transform: translateX(-5px); } 75% { transform: translateX(5px); } }
.kp-fly { position: fixed; z-index: 1000; pointer-events: none; border-radius: 16px; will-change: transform, opacity; }
@media (prefers-reduced-motion: reduce) { .kp-wheel, .kp-logo.shake { animation: none !important; } .kp-check { transition: none; } }
.unlock-art { display: flex; justify-content: center; margin: 2px 0 12px; }
.unlock-art .kp-logo { width: 72px; height: 72px; border-radius: 16px; }
/* where you are: the file list (neutral bar) or inside an unlocked vault file (amber bar + badge) */
.mode { font-size: 12px; font-weight: 700; padding: 3px 10px; border-radius: 999px; white-space: nowrap; }
.mode.files { background: rgba(255,255,255,.12); color: var(--bar-text); }
.mode.open { background: var(--open); color: #111827; }
body.in-vault .bar { background: var(--bar-vault); }
body.in-vault #vault { box-shadow: inset 0 3px 0 var(--open); }
.opened { font-size: 11px; font-weight: 700; padding: 1px 8px; border-radius: 999px; background: var(--open); color: #111827; }
.crumbs { display: flex; align-items: center; gap: 6px; color: var(--bar-muted); font-size: 13px; }
.crumbs b { color: var(--bar-text); font-weight: 600; }
.tools { display: flex; gap: 2px; flex-wrap: wrap; }
.tb { background: transparent; border: 1px solid transparent; color: var(--bar-text); border-radius: 6px; padding: 5px 9px;
  cursor: pointer; font-size: 13px; display: inline-flex; align-items: center; gap: 5px; white-space: nowrap; }
.tb:hover:not(:disabled) { background: rgba(255,255,255,.1); }
.tb:disabled { opacity: .35; cursor: default; }
.btn.lock { background: #f59e0b; color: #111827; border-color: #f59e0b; font-weight: 600; }
.btn.lock:hover { background: #fbbf24; }
.sep { width: 1px; height: 20px; background: rgba(255,255,255,.15); margin: 0 4px; }
.spacer { flex: 1; }
.search { background: rgba(255,255,255,.08); border: 1px solid rgba(255,255,255,.15); border-radius: 6px;
  color: var(--bar-text); padding: 6px 10px; width: 240px; outline: none; }
.search::placeholder { color: var(--bar-muted); }
.search:focus { border-color: var(--accent); background: rgba(255,255,255,.12); }
.chip { font: 12px var(--mono); color: var(--bar-muted); max-width: 220px; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }

/* ---- generic ---- */
.btn { padding: 7px 14px; border-radius: 6px; border: 1px solid var(--line2); background: var(--panel); cursor: pointer;
  font-weight: 500; display: inline-flex; align-items: center; gap: 6px; white-space: nowrap; }
.btn:hover:not(:disabled) { border-color: var(--accent); color: var(--accent); }
.btn:disabled { opacity: .5; cursor: default; }
.btn.primary { background: var(--accent); border-color: var(--accent); color: #fff; }
.btn.danger { background: var(--err); border-color: var(--err); color: #fff; }
.btn.primary:hover:not(:disabled), .btn.danger:hover:not(:disabled) { filter: brightness(1.08); color: #fff; }
.btn.sm { padding: 3px 9px; font-size: 12px; }
.icon-btn { border: none; background: none; cursor: pointer; padding: 3px 6px; border-radius: 5px; color: var(--muted); font-size: 13px; }
.icon-btn:hover:not(:disabled) { background: var(--line); color: var(--accent); }
.icon-btn:disabled { opacity: .35; cursor: default; }
.field .icon-btn { font-size: 17px; padding: 4px 9px; border: 1px solid var(--line); background: var(--panel2); }   /* copy / reveal: easy to hit */
.muted { color: var(--muted); }
.mono { font-family: var(--mono); }
.empty { padding: 48px 20px; text-align: center; color: var(--muted); }
.empty .big { font-size: 40px; margin-bottom: 8px; }
.tag { display: inline-block; background: var(--panel2); border: 1px solid var(--line); border-radius: 10px; padding: 0 8px;
  font-size: 12px; margin: 0 4px 4px 0; }

/* ---- both screens share one layout: tree | list | details. Vault files (S3): folders | files | file.
   An open vault (KeePass): groups | entries | entry. ---- */
#home { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; min-height: 0; }
#ftree { border-right: 1px solid var(--line); padding: 8px 0; background: var(--panel2); }
#flist { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#fdetail { padding: 18px 20px; }
.rec { font-size: 12px; padding: 4px 0; border-bottom: 1px dashed var(--line); display: flex; gap: 6px; }
.rec .when { color: var(--faint); white-space: nowrap; }
table { width: 100%; border-collapse: collapse; }
th { text-align: left; font-size: 12px; font-weight: 600; color: var(--muted); padding: 8px 12px; border-bottom: 1px solid var(--line);
  background: var(--panel2); white-space: nowrap; position: sticky; top: 0; z-index: 1; }
td { padding: 8px 12px; border-bottom: 1px solid var(--line); white-space: nowrap; overflow: hidden; text-overflow: ellipsis; max-width: 320px; }
tr.row:hover td { background: var(--panel2); }
tr.row.sel td { background: var(--accent-bg); color: var(--accent-text); }
.vault-name { display: flex; align-items: center; gap: 10px; font-weight: 600; cursor: pointer; }
.vault-name .kdbx { width: 30px; height: 30px; border-radius: 7px; display: grid; place-items: center;
  background: linear-gradient(135deg, #22c55e, #15803d); color: #fff; font-size: 15px; }
.actions { display: flex; gap: 4px; justify-content: flex-end; }

/* ---- the open vault: groups | entries | details (KeePassXC's window) ---- */
#vault { flex: 1; display: grid; grid-template-columns: 250px minmax(0, 1fr) 360px; min-height: 0; }
.pane { min-height: 0; overflow: auto; background: var(--panel); }
#tree { border-right: 1px solid var(--line); padding: 8px 0; background: var(--panel2); }
#list { border-right: 1px solid var(--line); display: flex; flex-direction: column; }
#detail { padding: 18px 20px; }
.pane-title { font-size: 11px; font-weight: 700; letter-spacing: .06em; text-transform: uppercase; color: var(--faint);
  padding: 6px 10px 6px 14px; display: flex; align-items: center; gap: 2px; }
.tree ul { list-style: none; }
.node { display: flex; align-items: center; gap: 4px; padding: 4px 10px 4px 0; cursor: pointer; user-select: none; }
.node:hover { background: var(--line); }
.node.sel { background: var(--accent-bg); color: var(--accent-text); font-weight: 600; }
.node.here { cursor: default; }
.node.here:not(.sel) { color: var(--muted); }
.node.here:not(.sel):hover { background: none; }
.node .caret { width: 16px; text-align: center; color: var(--faint); font-size: 10px; flex: none; }
.node .name { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.node .count { font-size: 11px; color: var(--faint); }
.safe { display: inline-block; width: 1.15em; height: 1.15em; vertical-align: -0.2em; }
.safe svg { width: 100%; height: 100%; display: block; }
.empty .big .safe { width: 44px; height: 44px; }
.list-head { display: flex; align-items: center; gap: 8px; padding: 10px 14px; border-bottom: 1px solid var(--line); justify-content: space-between; }
.list-head .title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
/* both screens: the title and count on the first line, the actions always on the second (same height everywhere) */
.list-head { flex-direction: column; align-items: stretch; gap: 8px; }
.list-title { display: flex; align-items: baseline; gap: 8px; min-width: 0; }
.list-actions { display: flex; gap: 6px; flex-wrap: wrap; }
.list-body { flex: 1; overflow: auto; }
.list-body tr.row { cursor: default; }
.list-body td.t { font-weight: 500; }
.tick { width: 28px; padding-right: 0; }
.tick input { width: 15px; height: 15px; cursor: pointer; }
.banner { padding: 10px 14px; border-bottom: 1px solid var(--warn-line); background: var(--warn-bg); display: flex; gap: 10px;
  align-items: center; flex-wrap: wrap; font-size: 13px; }
.banner b { color: var(--err); }
.d-title { font-size: 19px; font-weight: 700; margin-bottom: 2px; word-break: break-word; }
.d-path { color: var(--muted); font-size: 12px; margin-bottom: 16px; }
.field { margin-bottom: 14px; }
.field .k { font-size: 11px; font-weight: 700; letter-spacing: .05em; text-transform: uppercase; color: var(--faint); margin-bottom: 3px; }
.field .v { display: flex; align-items: center; gap: 4px; min-height: 26px; }
.field .val { flex: 1; word-break: break-all; }
.field .val.pw { font-family: var(--mono); letter-spacing: .04em; }
.field pre { white-space: pre-wrap; word-break: break-word; font: inherit; background: var(--panel2); border: 1px solid var(--line);
  border-radius: 6px; padding: 8px 10px; max-height: 260px; overflow: auto; }
.d-actions { display: flex; gap: 8px; margin: 18px 0 8px; }
.d-meta { font-size: 12px; color: var(--muted); border-top: 1px solid var(--line); padding-top: 10px; line-height: 1.8; }

/* ---- status bar + history of server calls ---- */
.status { display: flex; align-items: center; gap: 12px; padding: 4px 14px; font: 12px var(--mono); color: var(--muted);
  background: var(--panel); border-top: 1px solid var(--line); cursor: pointer; min-height: 26px; }
.status .last { flex: 1; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; }
.status .ver { color: var(--accent); white-space: nowrap; text-decoration: underline; text-underline-offset: 3px; }
.status .ver:hover { color: var(--accent-text); }
.ok { color: var(--ok); } .err { color: var(--err); }
.history { position: fixed; left: 0; right: 0; bottom: 26px; max-height: 40vh; overflow: auto; background: #111827; color: #d1d5db;
  font: 12px/1.7 var(--mono); padding: 8px 14px; border-top: 1px solid #374151; z-index: 5; }
.history .ok { color: #86efac; } .history .err { color: #fca5a5; }

/* ---- dialogs ---- */
dialog { border: none; border-radius: 12px; padding: 22px 24px; width: 440px; max-width: calc(100vw - 32px); max-height: calc(100vh - 32px);
  background: var(--panel); color: var(--text); box-shadow: 0 24px 64px rgba(0,0,0,.35); margin: auto; }
dialog.wide { width: 620px; }
dialog::backdrop { background: rgba(15,23,42,.55); }
dialog h3 { font-size: 17px; margin-bottom: 4px; }
dialog .note { color: var(--muted); font-size: 13px; margin-bottom: 4px; }
.f { margin-top: 12px; }
.f > label { display: block; font-size: 12px; font-weight: 600; color: var(--muted); margin-bottom: 4px; }
.f input[type=text], .f input[type=password], .f textarea { width: 100%; padding: 8px 10px; border: 1px solid var(--line2);
  border-radius: 6px; outline: none; }
.f input:focus, .f textarea:focus { border-color: var(--accent); box-shadow: 0 0 0 3px var(--accent-bg); }
.f textarea { min-height: 90px; resize: vertical; }
.f .row-in { display: flex; gap: 4px; align-items: center; }
.f .row-in input { flex: 1; }
.f .hint { font-size: 12px; color: var(--faint); margin-top: 3px; }
.f.check { margin-top: 6px; }
.f.check label { display: flex; gap: 8px; align-items: center; font-weight: 500; color: var(--text); font-size: 13px; }
.meter { height: 4px; border-radius: 2px; background: var(--line); margin-top: 6px; overflow: hidden; }
.meter i { display: block; height: 100%; width: 0; transition: width .2s, background .2s; }
.dlg-err { color: var(--err); font-size: 13px; min-height: 18px; margin-top: 10px; }
.dlg-err.busy { color: var(--muted); }   /* in progress (Unlocking …): grey; failed: red; done: green */
.dlg-err.done { color: var(--ok); }
.keyfile-note { margin-top: 8px; padding: 8px 10px; border: 1px solid var(--warn-line); background: var(--warn-bg);
  border-radius: 6px; font-size: 13px; line-height: 1.6; }
.keyfile-note b { color: var(--err); }
.dlg-actions { display: flex; gap: 8px; justify-content: flex-end; margin-top: 10px; }
.dlg-actions .left { margin-right: auto; }
.gen-out { font: 17px var(--mono); padding: 12px; border: 1px solid var(--line2); border-radius: 8px; background: var(--panel2);
  word-break: break-all; min-height: 50px; display: flex; align-items: center; gap: 8px; margin-top: 10px; }
.gen-out span { flex: 1; }
.gen-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 0 12px; }
.custom-row { display: grid; grid-template-columns: 1fr 1.4fr auto auto; gap: 4px; margin-top: 4px; align-items: center; }
.custom-row input[type=text], .custom-row input[type=password] { width: 100%; padding: 6px 8px; border: 1px solid var(--line2); border-radius: 6px; }
.toast { position: fixed; left: 50%; bottom: 44px; transform: translateX(-50%); background: #111827; color: #f9fafb;
  padding: 9px 16px; border-radius: 8px; font-size: 13px; box-shadow: 0 8px 24px rgba(0,0,0,.3); z-index: 20; opacity: 0;
  transition: opacity .2s; pointer-events: none; }
.toast.show { opacity: 1; }
.toast.bad { background: var(--err); }

@media (max-width: 1000px) {
  #vault, #home { grid-template-columns: 200px minmax(0, 1fr); }
  #detail, #fdetail { grid-column: 1 / -1; border-top: 1px solid var(--line); max-height: 45vh; }
}
.m-only { display: none !important; }
/* phone: one pane at a time (folders/groups › list › details), like an app; ‹ Back and ☰ move between them */
@media (max-width: 640px) {
  .m-only { display: inline-flex !important; }
  body { font-size: 15px; }
  .bar { gap: 6px; padding: 6px 10px; min-height: 48px; }
  .crumbs, #host, .bar > .sep { display: none; }
  .search { width: 100%; order: 10; padding: 9px 12px; }
  .tb { padding: 8px 10px; font-size: 17px; }
  .tb .lbl { display: none; }
  input, textarea, select { font-size: 16px !important; }   /* below 16px iOS zooms the page on focus */
  #vault, #home { display: flex; flex-direction: column; box-shadow: none; }
  #vault > .pane, #home > .pane { display: none; flex: 1; border: none; max-height: none; }
  body[data-pane=tree] #tree, body[data-pane=tree] #ftree,
  body[data-pane=detail] #detail, body[data-pane=detail] #fdetail { display: block; }
  body[data-pane=list] #list, body[data-pane=list] #flist { display: flex; }
  .node { padding-top: 11px; padding-bottom: 11px; font-size: 16px; }
  .pane-title { padding-top: 6px; }
  /* tables become one card per row: the name large, the rest on a second line */
  .list-body table, .list-body tbody, .list-body tr, .list-body td { display: block; }
  .list-body tr:not(.row) { display: none; }
  .list-body tr.row { padding: 12px 16px; border-bottom: 1px solid var(--line); }
  .list-body td { border: none; padding: 0; max-width: none; white-space: normal; background: none !important; }
  .list-body td.tick { display: none; }
  .list-body td.t { font-size: 16px; font-weight: 600; margin-bottom: 2px; }
  .list-body td:not(.t):not(.tick) { display: inline-block; margin-right: 12px; font-size: 13px; color: var(--muted); }
  .list-body tr.row.sel { background: var(--accent-bg); }
  .list-head { padding: 10px 12px; }
  .list-actions { flex-wrap: nowrap; overflow-x: auto; -webkit-overflow-scrolling: touch; padding-bottom: 2px; }
  .list-actions .btn.sm { padding: 8px 12px; font-size: 14px; flex: none; }
  .m-nav { padding: 8px 12px; font-size: 15px; }
  #detail, #fdetail, #tree, #ftree { padding: 0 16px 24px; }
  /* the pane's head (‹ Back + what it shows) and the list's head stay at the top while the pane scrolls */
  .m-head.m-only { display: flex !important; align-items: center; gap: 10px; position: sticky; top: 0; z-index: 3;
    margin: 0 -16px 12px; padding: 8px 16px; background: inherit; border-bottom: 1px solid var(--line); }
  .m-title { font-weight: 600; overflow: hidden; text-overflow: ellipsis; white-space: nowrap; min-width: 0; }
  .list-head { position: sticky; top: 0; z-index: 3; background: var(--panel); }
  /* inside a vault one bar stays on screen: ‹ Back (one level up) and 🔒 Lock; the panes' own heads step aside */
  #vnav { display: none !important; }
  body.in-vault #vnav { display: flex !important; align-items: center; gap: 10px; padding: 8px 12px;
    background: var(--panel); border-bottom: 1px solid var(--line); }
  #vnav .m-title { flex: 1; text-align: center; }
  body.in-vault .m-head, body.in-vault .m-nav, body.in-vault .list-actions .btn.lock { display: none !important; }
  .field .val { font-size: 16px; }
  .field .icon-btn { min-width: 44px; min-height: 44px; font-size: 20px; }
  .d-actions .btn { flex: 1; justify-content: center; padding: 12px; font-size: 16px; }
  /* dialogs: a sheet from the bottom, full width */
  dialog, dialog.wide { width: 100%; max-width: 100%; margin: auto 0 0; border-radius: 16px 16px 0 0; max-height: 92vh;
    padding-bottom: calc(22px + env(safe-area-inset-bottom)); }
  .gen-grid { grid-template-columns: 1fr; }
  .dlg-actions .btn { padding: 11px 16px; font-size: 16px; }
  .status { padding-bottom: env(safe-area-inset-bottom); }
}
</style>
</head>
<body>
<header class="bar">
  <div class="brand" id="brand" title="All vaults"><span class="logo kp-logo" data-state="locked"></span>s3keepass</div>
  <span class="mode" id="mode"></span>
  <nav class="crumbs" id="crumbs"></nav>
  <div class="sep"></div>
  <div class="tools" id="tools"></div>
  <div class="spacer"></div>
  <input class="search" id="search" type="search" placeholder="Search entries (⌘F)" autocomplete="off" hidden>
  <span class="chip" id="host" title="Endpoint"></span>
  <button class="tb" id="signout" title="Forget this deployment's sign-in (HTTP Basic) on this browser">Sign out</button>
</header>

<nav class="m-only" id="vnav">
  <button class="btn" id="vback">‹ Back</button><span class="m-title" id="vtitle"></span>
  <button class="btn lock" id="vlock">🔒 Lock</button>
</nav>
<main id="home">
  <aside class="pane tree" id="ftree"></aside>
  <section class="pane" id="flist"></section>
  <section class="pane" id="fdetail"></section>
</main>
<main id="vault" hidden>
  <aside class="pane tree" id="tree"></aside>
  <section class="pane" id="list"></section>
  <section class="pane" id="detail"></section>
</main>

<footer class="status" id="status" title="Click: history of server calls">
  <span class="last" id="last">ready</span><span id="savestate"></span><a class="ver" href="https://cloudformer.github.io/s3keepass/compat.html"
    target="_blank" rel="noopener noreferrer" title="Which local KeePass apps open these vaults">s3keepass __VERSION__</a>
</footer>
<div class="history" id="history" hidden></div>
<div class="toast" id="toast"></div>
<input type="file" id="file" accept=".kdbx" hidden>

<script src="vendor/kdbxweb.min.js"></script>
<script src="vendor/argon2-bundled.min.js"></script>
<script>
// vault-core: the only code that touches KeePass crypto (vendored kdbxweb + argon2, never hand-written).
// tests/compat/kdbx_node.js runs this same block in Node against keepassxc-cli. No DOM in here.
const Vault = (() => {
  const K = kdbxweb;

    {name: 'u', label: 'User', required: true, autocomplete: 'username'},
    {name: 'p', label: 'Password', type: 'password', required: true, autocomplete: 'current-password'}],
    {ok: 'Sign in', note: 'http_auth username / password of this deployment. ' +
                          'Your vaults stay locked: each one needs its own master password.'});
  if (!r) return false;
  cred = btoa(String.fromCharCode(...new TextEncoder().encode(r.u + ':' + r.p)));
  store.set('cred', cred);
  return true;
}

// ---------------- dialogs: one <dialog> per question, stacked (the generator opens over the entry editor) ----------------
// fields: {name, label, type: text|password|textarea|checkbox, value, required, hint, generate, meter} or {el}
// opts: {ok (false = no OK button), cancel, danger, note, wide, extra, busy, done (shown green for a moment), ctl,
//        validate(values) -> error text | null — may be async; the dialog stays open and shows the error}
const dialogOpen = () => !!document.querySelector('dialog[open]');
function ask(title, fields, opts = {}) {
  return new Promise(resolve => {
    const d = h('dialog', {class: opts.wide ? 'wide' : null});
    const inputs = {}, err = h('div', {class: 'dlg-err'});
    let done = false;
    const finish = v => { if (done) return; done = true; if (d.open) d.close(); d.remove(); resolve(v); };
    if (opts.ctl) opts.ctl.close = () => finish(null);
    const okBtn = opts.ok === false ? null : h('button', {class: 'btn ' + (opts.danger ? 'danger' : 'primary'), type: 'submit'}, opts.ok || 'OK');
    const form = h('form', {novalidate: true},
      h('h3', {text: title}), opts.note ? h('p', {class: 'note'}, opts.note) : null,   // text, or an element the caller updates
      fields.map(f => f.el || fieldEl(f, inputs)), err,
      h('div', {class: 'dlg-actions'}, opts.extra ? h('span', {class: 'left'}, opts.extra) : null,
        h('button', {type: 'button', class: 'btn', onclick: () => finish(null)}, opts.cancel || 'Cancel'), okBtn));
    form.addEventListener('submit', async e => {
      e.preventDefault();
      if (!okBtn || okBtn.disabled) return;
      const vals = {};
      for (const [k, el] of Object.entries(inputs)) vals[k] = el.type === 'checkbox' ? el.checked : el.type === 'file' ? el.keyFile : el.value;
      const missing = fields.find(f => f.required && !String(vals[f.name] || '').trim());
      err.classList.remove('busy', 'done');
      if (missing) { err.textContent = `${missing.label} is required`; inputs[missing.name].focus(); return; }
      if (opts.validate) {
        okBtn.disabled = true; err.textContent = opts.busy || ''; err.classList.add('busy');
        try { const msg = await opts.validate(vals); if (msg) { err.textContent = msg; return; } }
        catch (x) { err.textContent = x.message; return; }
        finally { okBtn.disabled = false; err.classList.remove('busy'); }
        if (opts.done) { err.textContent = '✓ ' + opts.done; err.classList.add('done'); await new Promise(r => setTimeout(r, 500)); }
      }
      finish(vals);
    });
    d.addEventListener('close', () => finish(null));      // Esc
    d.append(form); document.body.append(d); d.showModal();
    const first = form.querySelector('input:not([type=checkbox]):not([type=range]), textarea');
    if (first) { first.focus(); if (first.select) first.select(); }
  });
}
function fieldEl(f, inputs) {
  if (f.type === 'keyfile') return keyFileEl(f, inputs);
  if (f.type === 'checkbox') {
    const cb = h('input', {type: 'checkbox', checked: !!f.value});
    inputs[f.name] = cb;
    return h('div', {class: 'f check'}, h('label', {}, cb, f.label));
  }
  const input = f.type === 'textarea'
    ? h('textarea', {value: f.value || '', spellcheck: 'false'})
    : h('input', {type: f.type || 'text', value: f.value == null ? '' : f.value, autocomplete: f.autocomplete || 'off',
                  spellcheck: 'false', class: f.type === 'password' ? 'mono' : null});
  inputs[f.name] = input;
  const extras = [];
  if (f.type === 'password') {
    extras.push(h('button', {type: 'button', class: 'icon-btn', title: 'Show / hide', onclick: () => {
      input.type = input.type === 'password' ? 'text' : 'password'; }}, '👁'));
    if (f.generate) extras.push(h('button', {type: 'button', class: 'icon-btn', title: 'Password generator', onclick: async () => {
      const pw = await generatorDialog(true);
      if (pw != null) { input.value = pw; input.type = 'text'; input.dispatchEvent(new Event('input')); } }}, '🎲'));
  }
  const bar = f.meter ? h('i') : null, meter = bar ? h('div', {class: 'meter'}, bar) : null;
  if (bar) {
    const upd = () => { const s = strength(input.value); bar.style.width = s.pct + '%'; bar.style.background = s.color; meter.title = s.label; };
    input.addEventListener('input', upd); upd();
  }
  return h('div', {class: 'f'}, h('label', {text: f.label}),
    extras.length ? h('div', {class: 'row-in'}, input, extras) : input, meter,
    f.hint ? h('div', {class: 'hint', text: f.hint}) : null);
}

// ---------------- password generator ----------------
const SETS = {upper: 'ABCDEFGHIJKLMNOPQRSTUVWXYZ', lower: 'abcdefghijklmnopqrstuvwxyz', digits: '0123456789',
              symbols: '!#$%&*+-=?@^_~.,:;()[]{}<>/|'};
const LOOKALIKE = /[Il1O0o|]/g;
// the generator opens at GEN_LENGTH every time (a longer one is refused by some sites); the length chosen in the
// dialog is for that password only. The character sets are remembered.
const GEN_LENGTH = 20;
function genOpts() {
  const o = {upper: true, lower: true, digits: true, symbols: true, similar: true};
  try { Object.assign(o, JSON.parse(store.get('gen') || '{}')); } catch (e) {}
  o.length = GEN_LENGTH;
  return o;
}
function randInt(n) {   // uniform in [0, n): rejection sampling on crypto.getRandomValues, no modulo bias
  const lim = Math.floor(0x100000000 / n) * n, a = new Uint32Array(1);
  do crypto.getRandomValues(a); while (a[0] >= lim);
  return a[0] % n;
}
function generate(o) {
  let sets = Object.keys(SETS).filter(k => o[k]).map(k => o.similar ? SETS[k].replace(LOOKALIKE, '') : SETS[k]);
  if (!sets.length) sets = [SETS.lower];
  const all = sets.join(''), n = Math.max(4, Math.min(128, +o.length || 20));
  let pw;
  do pw = Array.from({length: n}, () => all[randInt(all.length)]).join('');
  while (!sets.every(s => [...pw].some(c => s.includes(c))));      // every chosen class appears at least once
  return pw;
}
function strength(pw) {
  let pool = 0;
  if (/[a-z]/.test(pw)) pool += 26;
  if (/[A-Z]/.test(pw)) pool += 26;
  if (/[0-9]/.test(pw)) pool += 10;
  if (/[^a-zA-Z0-9]/.test(pw)) pool += 33;
  const bits = pw.length * Math.log2(pool || 1);
  const [label, color] = bits < 40 ? ['weak', '#dc2626'] : bits < 70 ? ['fair', '#f59e0b'] : bits < 100 ? ['good', '#16a34a'] : ['excellent', '#059669'];
  return {pct: Math.min(100, bits), label: `${label} · ~${Math.round(bits)} bits`, color};
}
function generatorDialog(use) {
  const o = genOpts();
  const out = h('span', {class: 'mono'}), bits = h('div', {class: 'hint'});
  const len = h('input', {type: 'range', min: 8, max: 64, value: o.length, style: 'flex:1'}), lenN = h('b', {text: o.length});
  const boxes = {};
  const cb = (k, label) => { boxes[k] = h('input', {type: 'checkbox', checked: o[k]}); return h('div', {class: 'f check'}, h('label', {}, boxes[k], label)); };
  const regen = () => {
    o.length = +len.value; lenN.textContent = o.length;
    for (const k in boxes) o[k] = boxes[k].checked;
    store.set('gen', JSON.stringify(Object.assign({}, o, {length: undefined})));   // not the length
    out.textContent = generate(o); bits.textContent = strength(out.textContent).label;
  };
  const body = h('div', {},
    h('div', {class: 'gen-out'}, out,
      h('button', {type: 'button', class: 'icon-btn', title: 'New password', onclick: regen}, '↻'),
      h('button', {type: 'button', class: 'icon-btn', title: 'Copy', onclick: () => copy(out.textContent, 'Password')}, '⧉')),
    bits,
    h('div', {class: 'f'}, h('label', {}, 'Length'), h('div', {class: 'row-in'}, len, lenN)),
    h('div', {class: 'gen-grid'}, cb('upper', 'A–Z'), cb('lower', 'a–z'), cb('digits', '0–9'), cb('symbols', '!#$%&*…'),
      cb('similar', 'no look-alikes (I l 1 O 0 o |)')));
  len.addEventListener('input', regen);
  for (const k in boxes) boxes[k].addEventListener('change', regen);
  regen();
  return ask('Password generator', [{el: body}], {ok: use ? 'Use this password' : false, cancel: use ? 'Cancel' : 'Close'})
    .then(r => r && use ? out.textContent : null);
}

// ---------------- clipboard: a copied secret is cleared after 30 s ----------------
let clipToken = 0, clearOnFocus = false;
async function copy(text, what) {
  try { await navigator.clipboard.writeText(text); }
  catch (e) { toast('The browser blocked the clipboard', true); return; }
  const t = ++clipToken;
  toast(`${what} copied · clipboard clears in ${CLIPBOARD_CLEAR_S} s`);
  setTimeout(() => { if (t === clipToken) clearClipboard(); }, CLIPBOARD_CLEAR_S * 1000);
}
async function clearClipboard() {
  try { await navigator.clipboard.writeText(''); clearOnFocus = false; } catch (e) { clearOnFocus = true; }   // needs focus
}
addEventListener('focus', () => { if (clearOnFocus) clearClipboard(); });

    h('div', {class: 'field'}, h('div', {class: 'k', text: 'Access records'}), recs));
}

// a folder is only a name in a vault's path: S3 keeps no empty folders, so a new one lives in this page until a
// vault is created or uploaded into it (keepass/<folder>/<name>.kdbx)
async function newFolder() {
  const r = await ask('New folder', [{name: 'name', label: 'Folder name', required: true,
      hint: 'Letters, digits, @ . + - _ — e.g. shared, frank, team-ops'}],
    {ok: 'Create', note: 'It stays once you create or upload a vault into it.',
     validate: async v => {
       const name = v.name.trim();
       if (!FOLDER_RE.test(name) || name.includes('..')) return 'Folder: letters, digits, @ . + - _, at most 128, not starting with "."';
       if (F.folders.some(f => f.name === name)) return `A folder named "${name}" already exists`;
     }});
  if (!r) return;
  const name = r.name.trim();
  F.folders.push({name, path: `keepass/${name}/`, files: []});
  F.folder = name; F.file = null; vaults = [];
  renderHome();
}

// S3 has no folder rename: each vault file in the folder moves (copied, then the original deleted), one by one. If it
// stops half way nothing is lost: renaming again to the same name moves the rest into the folder that now exists.
async function renameFolder() {
  const from = F.folder, files = F.folders.find(f => f.name === from).files.slice(), failed = [];
  let to = '';
  const r = await ask(`Rename folder ${from}`, [{name: 'name', label: 'New name', value: from, required: true,
      hint: 'Letters, digits, @ . + - _ — e.g. shared, frank, team-ops'}],
    {ok: 'Rename', busy: 'Moving …',
     note: `S3 has no folder rename: each of its ${files.length} vault ${files.length === 1 ? 'file is' : 'files are'} moved — copied, then the ` +
       'original deleted. If it stops half way nothing is lost: rename again to move the rest. Older versions stay with the original names.',
     validate: async vals => {
       to = vals.name.trim();
       if (!FOLDER_RE.test(to) || to.includes('..')) return 'Folder: letters, digits, @ . + - _, at most 128, not starting with "."';
       if (to === from) return 'That is its name now';
       failed.length = 0;
       for (const x of files) {
         try { await call('POST', '/api/move', {body: JSON.stringify({path: x.path, etag: x.etag, folder: to}),
                                                headers: {'content-type': 'application/json'}}); }
         catch (e) { failed.push(`${x.name}: ${e.message}`); }
       }
       if (files.length && failed.length === files.length) return failed.join(' · ');
     }});
  if (!r) return;
  F.ticked.clear(); F.file = null;
  if (!files.length) {   // a folder only this page knows (nothing saved in it yet): just its name changes
    F.folders = F.folders.filter(f => f.name !== to);
    Object.assign(F.folders.find(f => f.name === from), {name: to, path: `keepass/${to}/`});
    F.folder = to; renderHome(); return;
  }
  if (failed.length) toast(`Not moved: ${failed.join(' · ')}`, true); else toast(`Renamed ${from} to ${to}`);
  F.folder = failed.length ? from : to; await showHome();
}

// ---- move vault files: the ticked ones, else the selected one, to another folder ----
function movableFiles() {
  const files = F.folders.find(f => f.name === F.folder).files;
  return F.ticked.size ? files.filter(x => F.ticked.has(x.name)) : F.file ? [F.file] : [];
}
async function moveFilesDialog() {

  const r = await ask(`Move ${what}`, [{el: h('div', {class: 'f'}, h('label', {}, 'To folder'), pick)}],
    {ok: 'Move', busy: 'Moving …', note: 'S3 has no rename: each file is copied, then the original deleted. Older versions stay with the original name.',
     validate: async () => {
       for (const x of files) {

                                                headers: {'content-type': 'application/json'}}); }

function checkName(name) {
  if (!NAME_RE.test(name)) return 'Name: letters, digits, space, _ - . ( ) — at most 64, not starting with "." or a space';
  if (vaults.some(v => v.name === name)) return `A vault named "${name}" already exists`;
  return null;
}

async function newVault() {
  let made = null, template;
  try { template = (await call('GET', '/api/template')).template; } catch (e) { return toast(`No template: ${e.message}`, true); }
  const r = await ask('New vault', [
    {name: 'name', label: 'Name', required: true, hint: `In ${F.folder ? '📁 ' + F.folder : 'Vaults'}`},
    {name: 'pw', label: 'Master password', type: 'password', required: true, generate: true, meter: true, autocomplete: 'new-password'},
    {name: 'pw2', label: 'Repeat master password', type: 'password', required: true, autocomplete: 'new-password'},
    {name: 'key', label: 'Key file', type: 'keyfile', hint: KEYFILE_HINT, generate: () => $('dialog[open] input').value.trim()}],
    {ok: 'Create', busy: `Tuning Argon2id to ≥ ${(template.kdf && template.kdf.unlock_ms || 2000) / 1000} s on this device, then encrypting …`, done: 'Created', note: 'The master password never leaves this browser. ' +
       'There is no recovery: if you forget it, the vault cannot be opened.',
     validate: async v => {

     }});

}

$('#file').addEventListener('change', async e => {
  const file = e.target.files[0]; e.target.value = '';
  if (!file) return;
  const bytes = await file.arrayBuffer();
  const sig = new Uint8Array(bytes.slice(0, 4));
  if (sig.length < 4 || sig[0] !== 0x03 || sig[1] !== 0xd9 || sig[2] !== 0xa2 || sig[3] !== 0x9a)
    return toast(`${file.name} is not a KeePass file`, true);
  if (bytes.byteLength > MAX_BYTES) return toast('A vault is at most 4.5 MB', true);
  const r = await ask('Upload a KeePass file', [
    {name: 'name', label: 'Vault name', required: true, value: file.name.replace(/\.kdbx$/i, ''), hint: `${file.name} · ${size(bytes.byteLength)}`}],
    {ok: 'Upload', note: 'Stored as it is (still encrypted); it opens here with its master password (and key file, if it has one).',
     validate: async v => {
       const bad = checkName(v.name.trim()); if (bad) return bad;
       await putVault(v.name.trim(), bytes, {'if-none-match': '*'}, 'upload', F.folder);
     }});
  if (r) { toast(`Uploaded ${r.name.trim()}`); showHome(); }
});

function saveFile(bytes, filename) {
  const a = h('a', {href: URL.createObjectURL(new Blob([bytes], {type: 'application/octet-stream'})), download: filename});
  document.body.append(a); a.click(); a.remove();
  setTimeout(() => URL.revokeObjectURL(a.href), 10000);
}

// ---------------- unlock / lock ----------------
// the access record of an unlock: only the vault's path and true / false, never anything secret. Best effort, never waited for.
function reportUnlock(v, ok) {
  call('POST', '/api/audit/unlock', {body: JSON.stringify({path: s3Path(v.name, v.folder), ok}),
    headers: {'content-type': 'application/json'}}).catch(() => {});
}
// The dialog opens at once and the encrypted file downloads meanwhile, so typing the password hides the wait.
// One unlock at a time: a second click or double-click while one is opening (or any dialog is up) is ignored.
let unlocking = false;
async function unlock(v) {
  if (unlocking || dialogOpen()) return;
  unlocking = true;
  try { await unlockDialog(v); } finally { unlocking = false; }
}
async function unlockDialog(v) {
  const loading = call('GET', vaultPath(v.name, v.folder), {raw: true});
  const note = h('span', {text: 'Loading the vault file …'});
  loading.then(f => { note.textContent = `${size(f.bytes.byteLength)} · decrypted in this browser only`; },
               e => { note.textContent = `Cannot load the vault file: ${e.message}`; note.className = 'err'; });
  let file, db;
  const art = kpIcon();
  let artRect = null;
  const r = await ask(`Unlock ${v.name}`, [
    {el: h('div', {class: 'unlock-art'}, art)},
    {name: 'pw', label: 'Master password', type: 'password', autocomplete: 'current-password'},
    {name: 'key', label: 'Key file', type: 'keyfile', hint: 'Only if this vault uses one. Read in this browser, never uploaded.'}],
    {ok: 'Unlock', busy: 'Unlocking …', done: 'Unlocked', note,
     validate: async x => {
       if (!x.pw && !x.key) return 'Enter the master password (or choose the key file)';
       try { file = await loading; }     // typed faster than the download: it finishes here
       catch (e) { return `Cannot load the vault file: ${e.message}`; }
       art.dataset.state = 'unlocking';
       // let the turning wheel reach the screen (and the GPU) before Argon2 holds the main thread
       await new Promise(r => requestAnimationFrame(() => requestAnimationFrame(r)));
       try { db = await Vault.open(file.bytes.slice(0), x.pw, x.key); }
       catch (e) {
         art.dataset.state = 'locked';
         art.classList.remove('shake'); void art.offsetWidth; art.classList.add('shake');
         if (e.code === 'InvalidKey') { reportUnlock(v, false); return 'Wrong master password or key file'; }
         return `Cannot open: ${e.message}`;
       }
       art.dataset.state = 'open';
       artRect = art.getBoundingClientRect();
       reportUnlock(v, true);
     }});
  if (r && db) flyToLogo(artRect, () => openDb({name: v.name, folder: v.folder || '', db, etag: file.etag, size: file.bytes.byteLength}));
}

function openDb({name, folder = '', db, etag, size = 0}) {
  S = {name, folder, db, etag, size, diff: [], group: db.getDefaultGroup(), entry: null, ticked: new Set(), search: '', open: new Set(), conflict: null, saved: null, error: null};
  S.open.add(S.group.uuid.id);
  $('#home').hidden = true; $('#vault').hidden = false; $('#search').hidden = false;
  document.body.classList.add('in-vault');
  pane('tree');
  $('#mode').className = 'mode open'; $('#mode').textContent = `🔓 Inside ${name}.kdbx`;
  $('#signout').hidden = true;   // inside a vault the way out is Lock; Sign out is on the vault-file list only
  $('#search').value = '';
  lastActive = Date.now();
  renderVault();
  call('GET', '/api/template').then(r => { if (S && S.db === db) { S.template = r.template; S.diff = Vault.templateDiff(db, r.template); renderVault(); } })
    .catch(() => {});
}

async function lock() {
  if (!S) return;
  if (saving) await saving.catch(() => {});
  if (S.error || S.conflict) {
    const go = await ask('Lock with an unsaved change?', [], {danger: true, ok: 'Lock and discard',
      note: 'The last change was not saved to S3. Download your copy first if you want to keep it.',
      extra: h('button', {type: 'button', class: 'btn', onclick: downloadLocal}, '⤓ Download my copy')});
    if (!go) return;
  }
  S = null;
  if (clipToken) { clipToken++; clearClipboard(); }
  pane('list');   // leaving a vault goes one level up, to its folder's files (the file stays selected), wherever it was left
  showHome();
}
$('#brand').addEventListener('click', () => S ? lock() : showHome());
$('#vback').addEventListener('click', () => { const up = UP[document.body.dataset.pane]; if (up) pane(up); });
$('#vlock').addEventListener('click', lock);

let lastActive = Date.now();
for (const ev of ['pointerdown', 'keydown', 'wheel', 'pointermove']) addEventListener(ev, () => lastActive = Date.now(), {passive: true});
setInterval(() => {
  if (S && !saving && !dialogOpen() && Date.now() - lastActive > IDLE_LOCK_MIN * 60000) { lock(); toast('Locked after inactivity'); }
}, 15000);

// ---------------- saving: after every change, conditional on the version this tab read ----------------
function changed() { renderVault(); save(); }
function save() {
  if (!S || S.conflict) return Promise.resolve();
  if (saving) { saveAgain = true; return saving; }
  const s = S;
  saving = (async () => {
    do {
      saveAgain = false;
      renderSaveState('saving …');
      const bytes = await Vault.save(s.db);
      try {
        const r = await putVault(s.name, bytes, {'if-match': s.etag}, '', s.folder);
        s.etag = r.etag; s.size = bytes.byteLength; s.saved = new Date(); s.error = null;
      } catch (e) {
        if (e.status === 409) { s.conflict = bytes; renderVault(); }       // refused: never overwrite another save
        else { s.error = e.message; toast('Not saved: ' + e.message, true); }
        return;
      }
    } while (saveAgain);
  })().finally(() => { saving = null; renderSaveState(); });
  return saving;
}
function renderSaveState(text) {
  const el = $('#savestate');
  if (!S) { el.textContent = ''; return; }
  el.className = S.conflict || S.error ? 'err' : 'ok';
  el.textContent = text || (S.conflict ? '⚠ not saved: changed elsewhere' : S.error ? '⚠ not saved' :
    S.saved ? `✓ saved ${S.saved.toTimeString().slice(0, 8)}` : '');
}
async function downloadLocal() {
  if (!S) return;
  saveFile(S.conflict || await Vault.save(S.db), `${S.name} (my copy ${new Date().toISOString().slice(0, 16).replace(':', '')}).kdbx`);
}
async function reopen() {
  const {name, folder} = S; S = null;
  F.folder = folder; await showHome();
  const v = vaults.find(x => x.name === name);
  if (v) unlock(v);
}

// ---------------- the open vault ----------------
function groupPath(g) { const p = []; for (; g; g = g.parentGroup) p.unshift(g.name || ''); return p; }
function entryCount(g) { let n = 0; for (const _ of g.allEntries()) n++; return n; }
function visibleEntries() {
  const q = S.search.trim().toLowerCase();
  if (!q) return S.group.entries.slice();
  const out = [];
  for (const e of S.db.getDefaultGroup().allEntries()) {
    if (Vault.inRecycleBin(S.db, e)) continue;
    const f = Vault.fields(e);
    const hay = [f.title, f.username, f.url, f.notes, ...f.tags, ...f.custom.filter(c => !c.protected).map(c => c.value)].join('\n');
    if (hay.toLowerCase().includes(q)) out.push(e);
  }
  return out;
}

function renderVault() {
  if (!S) return;
  const ro = !!S.conflict;
  crumbs('Vaults', ...(S.folder ? [S.folder] : []), `${S.name}.kdbx`);
  toolbar([
    {icon: '👤', label: 'Copy user', title: 'Copy the user name (⌘B)', disabled: !S.entry, do: () => copyField('username')},
    {icon: '🔑', label: 'Copy password', title: 'Copy the password (⌘C)', disabled: !S.entry, do: () => copyField('password')},
    '|',
    {icon: '🎲', label: 'Generator', do: () => generatorDialog(false)},
    {icon: '🧹', label: 'Clean up', title: 'Empty every entry\'s history and the recycle bin, then save (the file shrinks)', disabled: ro, do: cleanUp},
    {icon: '⚙', label: 'Master key', title: 'Change the master password and key file', disabled: ro, do: changeMaster},
  ]);
  renderTree(ro); renderList(ro); renderDetail(ro); renderSaveState(); renderVnav();
}

function renderTree(ro) {
  const bin = Vault.recycleBin(S.db), rootGroup = S.db.getDefaultGroup();
  const node = (g, depth) => {
    const kids = g.groups.filter(x => x !== bin).concat(depth === 0 && bin ? [bin] : []);   // the bin last, like KeePassXC
    const open = S.open.has(g.uuid.id);
    const row = h('div', {class: 'node' + (g === S.group && !S.search ? ' sel' : ''), style: `padding-left:${8 + depth * 14}px`,
        onclick: () => { S.group = g; S.entry = null; S.ticked.clear(); S.search = ''; $('#search').value = ''; S.open.add(g.uuid.id); renderVault(); pane('list'); },
        ondblclick: () => { if (!ro && g !== bin && depth > 0) groupDialog(g); }},
      h('span', {class: 'caret', onclick: e => { e.stopPropagation(); open ? S.open.delete(g.uuid.id) : S.open.add(g.uuid.id); renderVault(); }},
        kids.length ? (open ? '▾' : '▸') : ''),
      h('span', {}, g === bin ? '🗑' : depth === 0 ? safe(true) : '🗂'),   // icons: 🗃 Vaults, 📁 folder, safe vault (open when unlocked), 🗂 group, 🔑 entry
      h('span', {class: 'name', text: g.name || '(unnamed)', title: g.name || ''}),
      h('span', {class: 'count'}, entryCount(g) || ''));
    return h('li', {}, row, open && kids.length ? h('ul', {}, kids.map(k => node(k, depth + 1))) : null);
  };
  const inBin = Vault.inRecycleBin(S.db, S.group), atRoot = S.group === rootGroup;
  // where this vault lives (🗃 Vaults › 📁 folder › this file), shown only: no click here leaves the vault — Lock
  // first, then the folders work again. Below it, the groups inside the file.
  const s3node = (icon, label, depth, sel, title) => h('div', {class: 'node here' + (sel ? ' sel' : ''),
      style: `padding-left:${8 + depth * 14}px`, title},
    h('span', {class: 'caret'}), h('span', {}, icon), h('span', {class: 'name', text: label}),
    // the open file is marked, not a second Close next to Lock: leaving is Lock (top bar) or a folder above
    sel ? h('span', {class: 'opened', title: 'Unlocked in this browser; Lock (top bar) closes it'}, 'Opened') : null);
  const s3 = [h('div', {class: 'pane-title'}, 'Library'),
    s3node('🗃', 'Vaults', 0, false, 'Lock the vault to browse the folders'),
    S.folder ? s3node('📁', S.folder, 1, false, 'Lock the vault to browse the folders') : null,
    s3node(safe(true), `${S.name}.kdbx`, S.folder ? 2 : 1, true, `s3://…/${s3Path(S.name, S.folder)} · unlocked in this browser`)].filter(Boolean);
  // no delete here: a destructive action is no shortcut; the selected group's panel (right) has it
  $('#tree').replaceChildren(backBtn('list', 'Groups'), ...s3,
    h('div', {class: 'pane-title', style: 'margin-top:10px;border-top:1px solid var(--line);padding-top:10px'}, 'Groups · inside this file', h('span', {class: 'spacer'}),
      h('button', {class: 'icon-btn', title: 'Rename the group', disabled: ro || atRoot || S.group === bin, onclick: () => groupDialog(S.group)}, '✎')),
    h('ul', {}, node(rootGroup, 0)));
}

function renderList(ro) {
  const list = visibleEntries(), searching = !!S.search.trim();
  if (S.entry && !list.includes(S.entry)) S.entry = null;
  for (const e of [...S.ticked]) if (!list.includes(e)) S.ticked.delete(e);
  const inBin = Vault.inRecycleBin(S.db, S.group), bin = Vault.recycleBin(S.db), atRoot = S.group === S.db.getDefaultGroup();
  const head = h('div', {class: 'list-head'},
    h('div', {class: 'list-title'}, navBtn('☰ Groups', 'tree'),
      h('span', {class: 'title', text: searching ? `Search: ${S.search}` : groupPath(S.group).slice(1).join(' / ') || S.group.name}),
      h('span', {class: 'muted'}, `${list.length} ${list.length === 1 ? 'entry' : 'entries'}`)),
    actionRow([
      // highlighted: what comes next — nothing selected: add; an entry selected: Edit it.
      // Edit / Delete act on the selected entry, or with none selected on the group shown (not the vault's top level)
      {icon: '＋', label: 'New entry', title: 'New entry in this group', primary: !S.entry, disabled: ro || inBin, do: () => entryDialog(null)},
      {icon: '＋', label: 'New group', title: 'New group inside this group', primary: !S.entry, disabled: ro || inBin, do: () => groupDialog(null)},
      S.entry || searching
        ? {icon: '✎', label: 'Edit', title: 'Edit the entry (Enter)', primary: !!S.entry, disabled: ro || !S.entry, do: () => entryDialog(S.entry)}
        : {icon: '✎', label: 'Rename group', disabled: ro || atRoot || S.group === bin, do: () => groupDialog(S.group)},
      movable().length || searching
        ? {icon: '⇢', label: 'Move to…', title: 'Move the ticked entries (or the selected one) to another group', disabled: ro || !movable().length, do: moveDialog}
        : {icon: '⇢', label: 'Move group', title: 'Move the group, with everything in it, under another group', disabled: ro || atRoot || S.group === bin, do: () => moveGroupDialog(S.group)},
      S.entry || searching
        ? {icon: '🗑', label: 'Delete', title: 'Delete the entry (Del)', disabled: ro || !S.entry, do: () => deleteEntry(S.entry)}
        : {icon: '🗑', label: 'Delete group', disabled: ro || atRoot, do: () => deleteGroup(S.group)},
      {icon: '🔒', label: `Lock ${S.name}`, cls: 'lock', title: 'Lock (⌘L): forget the decrypted vault in this tab; also after 5 minutes idle', do: lock},
    ]));
  const banner = S.conflict ? h('div', {class: 'banner'},
    h('span', {}, h('b', {}, 'Not saved. '), 'This vault was changed elsewhere (another tab or device) after you opened it. ' +
      'Nothing was overwritten; your last change exists only in this tab.'),
    h('button', {class: 'btn sm', onclick: downloadLocal}, '⤓ Download my copy'),
    h('button', {class: 'btn sm primary', onclick: reopen}, 'Reopen the latest')) : null;
  const notices = [
    S.diff.length && !ro ? h('div', {class: 'banner'},
      h('span', {}, h('b', {}, 'Not like the template: '), S.diff.map(d => `${d.what} ${d.now} (template: ${d.template})`).join(' · ')),
      h('button', {class: 'btn sm primary', onclick: applyTemplate}, 'Apply the template')) : null,
    S.size > WARN_BYTES ? h('div', {class: 'banner'},
      h('span', {}, h('b', {}, `${size(S.size)}: `), `close to the ${size(MAX_BYTES)} limit — remove attachments, then 🧹 Clean up.`)) : null,
  ];
  const rows = list.map(e => {
    const f = Vault.fields(e);
    let host = f.url; try { host = new URL(f.url).host || f.url; } catch (x) {}
    return h('tr', {class: 'row' + (e === S.entry ? ' sel' : ''), onclick: () => { S.entry = e; renderVault(); pane('detail'); },
        ondblclick: () => { if (!ro) entryDialog(e); }},
      h('td', {class: 'tick'}, h('input', {type: 'checkbox', checked: S.ticked.has(e), disabled: ro,
        onclick: ev => ev.stopPropagation(), onchange: ev => { ev.target.checked ? S.ticked.add(e) : S.ticked.delete(e); renderVault(); }})),
      h('td', {class: 't'}, '🔑 ', f.title || '(no title)'),
      h('td', {}, f.username),
      h('td', {class: 'muted'}, host),
      searching ? h('td', {class: 'muted'}, groupPath(e.parentGroup).slice(1).join(' / ')) : null,
      h('td', {class: 'muted'}, e.times.lastModTime ? e.times.lastModTime.toLocaleDateString() : ''));
  });
  const body = list.length ? h('table', {},
    h('tr', {}, h('th', {class: 'tick'}, h('input', {type: 'checkbox', title: 'Tick all', disabled: ro,
        checked: list.length > 0 && list.every(e => S.ticked.has(e)),
        onchange: ev => { for (const e of list) ev.target.checked ? S.ticked.add(e) : S.ticked.delete(e); renderVault(); }})),
      h('th', {}, 'Title'), h('th', {}, 'User name'), h('th', {}, 'URL'), searching ? h('th', {}, 'Group') : null, h('th', {}, 'Modified')),
    rows) : h('div', {class: 'empty'}, searching ? 'No match.' : Vault.inRecycleBin(S.db, S.group) ? 'Nothing in here.' :
      h('div', {}, 'No entries in this group.'));
  $('#list').replaceChildren(...[head, banner, ...notices, h('div', {class: 'list-body'}, body)].filter(Boolean));
}

// the entry's TOTP code of the moment and its seconds left; ticks while the entry is on screen
let otpTimer;
function otpField(uri) {
  const code = h('span', {class: 'val mono'}), left = h('span', {class: 'muted'});
  const tick = async () => {
    try { const t = await Vault.totp(uri); code.textContent = t.code.replace(/^(\d{3})(\d+)$/, '$1 $2'); left.textContent = ` · ${t.remaining}s`; }
    catch (x) { clearInterval(otpTimer); code.textContent = x.message; }
  };
  tick(); otpTimer = setInterval(() => code.isConnected ? tick() : clearInterval(otpTimer), 1000);
  return h('div', {class: 'field'}, h('div', {class: 'k', text: 'TOTP'}), h('div', {class: 'v'}, code, left,
    h('button', {class: 'icon-btn', title: 'Copy', onclick: async () => copy((await Vault.totp(uri)).code, 'TOTP code')}, '⧉')));
}

function renderDetail(ro) {
  clearInterval(otpTimer);
  const e = S.entry, el = $('#detail');
  if (!e) { renderGroupDetail(ro); return; }
  const f = Vault.fields(e), dots = v => '•'.repeat(Math.min(16, v.length));
  const secret = (label, value) => {
    const val = h('span', {class: 'val pw', text: dots(value)});
    let shown = false;
    return h('div', {class: 'field'}, h('div', {class: 'k', text: label}), h('div', {class: 'v'}, val,
      value ? h('button', {class: 'icon-btn', title: 'Show / hide', onclick: () => { shown = !shown; val.textContent = shown ? value : dots(value); }}, '👁') : null,
      value ? h('button', {class: 'icon-btn', title: 'Copy', onclick: () => copy(value, label)}, '⧉') : null));
  };
  const plain = (label, value, link) => !value ? null : h('div', {class: 'field'}, h('div', {class: 'k', text: label}), h('div', {class: 'v'},
    link && /^https?:\/\//i.test(value) ? h('a', {class: 'val', href: value, target: '_blank', rel: 'noopener noreferrer', text: value})
                                        : h('span', {class: 'val', text: value}),
    h('button', {class: 'icon-btn', title: 'Copy', onclick: () => copy(value, label)}, '⧉')));
  const t = e.times, forever = Vault.deleteIsFinal(S.db, e), otp = f.custom.find(c => c.name === Vault.OTP && c.value);
  el.replaceChildren(...[
    backBtn('list', f.title || '(no title)'),
    h('div', {class: 'd-title', text: f.title || '(no title)'}),
    h('div', {class: 'd-path', text: groupPath(e.parentGroup).join(' / ')}),
    plain('User name', f.username),
    secret('Password', f.password),
    otp ? otpField(otp.value) : null,
    plain('URL', f.url, true),
    f.notes ? h('div', {class: 'field'}, h('div', {class: 'k'}, 'Notes'), h('pre', {text: f.notes})) : null,
    ...f.custom.filter(c => c.name !== Vault.OTP).map(c => c.protected ? secret(c.name, c.value) : plain(c.name, c.value)),
    f.tags.length ? h('div', {class: 'field'}, h('div', {class: 'k'}, 'Tags'), h('div', {}, f.tags.map(x => h('span', {class: 'tag', text: x})))) : null,
    ro ? null : h('div', {class: 'd-actions'},
      h('button', {class: 'btn primary', onclick: () => entryDialog(e)}, '✎ Edit'),
      h('button', {class: 'btn', onclick: () => deleteEntry(e)}, forever ? 'Delete forever' : '🗑 Delete')),
    h('div', {class: 'd-meta'},
      h('div', {}, `Modified ${t.lastModTime ? t.lastModTime.toLocaleString() : '—'}`),
      h('div', {}, `Created ${t.creationTime ? t.creationTime.toLocaleString() : '—'}`),
      e.history.length ? h('div', {}, `History: ${e.history.length} earlier version${e.history.length > 1 ? 's' : ''}`) : null,
      e.binaries.size ? h('div', {}, `Attachments: ${[...e.binaries.keys()].join(', ')} (kept; open them in KeePassXC)`) : null),
  ].filter(Boolean));
}

// no entry selected: the selected group's panel — what is in it, and renaming or deleting it (not a tree shortcut)
function renderGroupDetail(ro) {
  const g = S.group, el = $('#detail'), bin = Vault.recycleBin(S.db), atRoot = g === S.db.getDefaultGroup();
  if (S.search.trim()) { el.replaceChildren(h('div', {class: 'empty'}, h('div', {class: 'big'}, '🔐'), 'Select an entry')); return; }
  const info = (k, val) => h('div', {class: 'field'}, h('div', {class: 'k', text: k}), h('div', {class: 'v'}, h('span', {class: 'val', text: val})));
  el.replaceChildren(...[
    backBtn('list', g.name || '(unnamed)'),
    h('div', {class: 'd-title'}, g === bin ? '🗑 ' : atRoot ? '' : '🗂 ', g.name || '(unnamed)'),
    h('div', {class: 'd-path', text: atRoot ? 'The vault itself: select an entry, or a group to rename or delete it' : groupPath(g).join(' / ')}),
    info('Entries', `${g.entries.length} here · ${entryCount(g)} with subgroups`),
    info('Subgroups', String(g.groups.length)),
    ro || atRoot ? null : h('div', {class: 'd-actions'},
      g === bin ? null : h('button', {class: 'btn', onclick: () => groupDialog(g)}, '✎ Rename'),
      g === bin ? null : h('button', {class: 'btn', onclick: () => moveGroupDialog(g)}, '⇢ Move'),
      h('button', {class: 'btn', onclick: () => deleteGroup(g)}, Vault.deleteIsFinal(S.db, g) ? 'Delete group forever' : '🗑 Delete group')),
  ].filter(Boolean));
}

// ---------------- editing: every change is saved at once ----------------
async function entryDialog(entry) {
  const f = entry ? Vault.fields(entry) : {title: '', username: '', password: generate(genOpts()), url: '', notes: '', tags: [],
    custom: Vault.templateFields(S.db).map(name => ({name, value: '', protected: false}))};
  const customBox = h('div', {}), rows = [];
  const addRow = c => {
    const name = h('input', {type: 'text', value: c.name, placeholder: 'name'});
    const value = h('input', {type: c.protected ? 'password' : 'text', value: c.value, placeholder: 'value', class: 'mono'});
    const prot = h('input', {type: 'checkbox', checked: c.protected});
    prot.addEventListener('change', () => value.type = prot.checked ? 'password' : 'text');
    const r = {name, value, prot};
    const row = h('div', {class: 'custom-row'}, name, value, h('label', {title: 'Protected (hidden, like a password)'}, prot, ' 🔒'),
      h('button', {type: 'button', class: 'icon-btn', title: 'Remove', onclick: () => { row.remove(); rows.splice(rows.indexOf(r), 1); }}, '✕'));
    rows.push(r); customBox.append(row);
  };
  const otp = (f.custom.find(c => c.name === Vault.OTP) || {}).value || '';
  f.custom.filter(c => c.name !== Vault.OTP).forEach(addRow);
  const customEl = h('div', {class: 'f'}, h('label', {}, 'Additional attributes'), customBox,
    h('button', {type: 'button', class: 'btn sm', style: 'margin-top:6px', onclick: () => addRow({name: '', value: '', protected: false})}, '＋ Attribute'));
  const r = await ask(entry ? 'Edit entry' : 'New entry', [
    {name: 'title', label: 'Title', value: f.title, required: true},
    {name: 'username', label: 'User name', value: f.username},
    {name: 'password', label: 'Password', type: 'password', value: f.password, generate: true, meter: true, autocomplete: 'new-password'},
    {name: 'otp', label: 'TOTP (two-factor code)', type: 'password', value: otp,
     hint: 'The otpauth://totp/… link or the secret key (Base32) the site shows when two-factor is set up; empty = none'},
    {name: 'url', label: 'URL', value: f.url},
    {name: 'notes', label: 'Notes', type: 'textarea', value: f.notes},
    {name: 'tags', label: 'Tags', value: f.tags.join(', '), hint: 'comma separated'},
    {el: customEl}],
    {ok: entry ? 'Save' : 'Add', wide: true, note: 'In ' + groupPath(entry ? entry.parentGroup : S.group).join(' / '),
     validate: v => {
       if (v.otp.trim()) try { Vault.parseOtp(v.otp); } catch (x) { return 'TOTP: ' + x.message; }
       const names = rows.map(x => x.name.value.trim()).filter(Boolean);
       if (names.some(n => ['Title', 'UserName', 'Password', 'URL', 'Notes', Vault.OTP].includes(n))) return 'An attribute cannot use a standard field name';
       if (new Set(names).size !== names.length) return 'Two attributes have the same name';
       return null;
     }});
  if (!r || !S || S.conflict) return;
  const values = {title: r.title.trim(), username: r.username, password: r.password, url: r.url.trim(), notes: r.notes,
    tags: r.tags.split(/[,;]/).map(x => x.trim()).filter(Boolean),
    custom: rows.filter(x => x.name.value.trim()).map(x => ({name: x.name.value.trim(), value: x.value.value, protected: x.prot.checked}))};
  const uri = Vault.otpUri(r.otp, values.title, values.username);
  if (uri) values.custom.push({name: Vault.OTP, value: uri, protected: true});
  if (entry) Vault.editEntry(entry, values);
  else S.entry = Vault.addEntry(S.db, S.group, values);
  changed();
}

// ---- move entries: the ticked ones, else the selected one, to a group chosen from the vault's tree ----
const movable = () => S.ticked.size ? [...S.ticked] : S.entry ? [S.entry] : [];
async function moveDialog() {
  const entries = movable(), bin = Vault.recycleBin(S.db);
  const groups = [];
  const walk = (g, depth) => { if (g === bin) return; groups.push([g, depth]); for (const k of g.groups) walk(k, depth + 1); };
  walk(S.db.getDefaultGroup(), 0);
  const pick = h('select', {style: 'width:100%;padding:6px'}, groups.map(([g, d], i) =>
    h('option', {value: i, disabled: entries.every(e => e.parentGroup === g)}, '\u00a0\u00a0'.repeat(d) + (d ? '🗂 ' : '') + (g.name || '(root)'))));
  pick.value = String(groups.findIndex(([g]) => !entries.every(e => e.parentGroup === g)));
  const n = entries.length, what = n === 1 ? `"${Vault.fields(entries[0]).title || '(no title)'}"` : `${n} entries`;
  const r = await ask(`Move ${what}`, [{el: h('div', {class: 'f'}, h('label', {}, 'To group'), pick)}], {ok: 'Move'});
  if (!r || !S || S.conflict || pick.value === '-1') return;
  const to = groups[+pick.value][0];
  Vault.moveEntries(S.db, entries, to);
  S.ticked.clear(); S.entry = null;
  toast(`Moved ${what} to ${to.name || 'the root'}`);
  changed();
}

// a whole group, with its entries and subgroups, under another group (not into itself or below it, not the recycle bin)
async function moveGroupDialog(group) {
  const bin = Vault.recycleBin(S.db), groups = [];
  const walk = (g, depth) => { if (g === bin || g === group) return; groups.push([g, depth]); for (const k of g.groups) walk(k, depth + 1); };
  walk(S.db.getDefaultGroup(), 0);
  const first = groups.findIndex(([g]) => g !== group.parentGroup);
  if (first < 0) return toast('No other group to move it to', true);
  const pick = h('select', {style: 'width:100%;padding:6px'}, groups.map(([g, d], i) =>
    h('option', {value: i, disabled: g === group.parentGroup}, '\u00a0\u00a0'.repeat(d) + (d ? '🗂 ' : '') + (g.name || '(root)'))));
  pick.value = String(first);
  const r = await ask(`Move group "${group.name}"`, [{el: h('div', {class: 'f'}, h('label', {}, 'To group'), pick)}],
    {ok: 'Move', note: `With everything in it: ${entryCount(group)} entries and its subgroups.`});
  if (!r || !S || S.conflict) return;
  const to = groups[+pick.value][0];
  Vault.moveGroup(S.db, group, to);
  S.open.add(to.uuid.id);
  toast(`Moved "${group.name}" to ${to.name || 'the top level'}`);
  changed();
}

async function cleanUp() {
  if (!(await confirmDlg(`Clean up ${S.name}?`, 'Every entry keeps only its current values; the recycle bin is emptied for good. ' +
    'Earlier S3 versions of the file still have the old data.', 'Clean up'))) return;
  Vault.clearHistory(S.db); toast('Cleaned up'); changed();
}
async function applyTemplate() {
  if (!(await confirmDlg(`Apply the template to ${S.name}?`, S.diff.map(d => `${d.what}: ${d.now} → ${d.template}`).join(' · ') +
    '. History the template does not keep is removed.', 'Apply'))) return;
  Vault.followTemplate(S.db, S.template); S.diff = []; toast('Template applied'); changed();
}

async function deleteEntry(e) {
  const f = Vault.fields(e), forever = Vault.deleteIsFinal(S.db, e);
  if (forever && !(await confirmDlg(`Delete "${f.title}" forever?`, 'It is removed from the vault (earlier S3 versions of the file still have it).'))) return;
  Vault.remove(S.db, e);
  S.entry = null;
  if (!forever) toast(`Moved "${f.title}" to the recycle bin`);
  changed();
}

async function groupDialog(group) {
  const r = await ask(group ? 'Rename group' : 'New group', [{name: 'name', label: 'Name', value: group ? group.name : '', required: true}],
    {ok: group ? 'Rename' : 'Create', note: group ? null : 'Inside ' + groupPath(S.group).join(' / ')});
  if (!r || !S || S.conflict) return;
  if (group) Vault.renameGroup(group, r.name.trim());
  else { S.open.add(S.group.uuid.id); S.group = Vault.addGroup(S.db, S.group, r.name.trim()); S.entry = null; }
  changed();
}

async function deleteGroup(g) {
  const forever = Vault.deleteIsFinal(S.db, g), n = entryCount(g);
  if (!(await confirmDlg(`Delete group "${g.name}"?`, forever ? `It and its ${n} entries are removed from the vault.` :
    `It moves to the recycle bin with its ${n} entries.`))) return;
  Vault.remove(S.db, g);
  S.group = S.db.getDefaultGroup(); S.entry = null;
  changed();
}

async function changeMaster() {
  let done = false;
  await ask('Change master key', [
    {name: 'old', label: 'Current master password', type: 'password', autocomplete: 'current-password'},
    {name: 'oldkey', label: 'Current key file', type: 'keyfile', hint: 'Only if this vault uses one now.'},
    {name: 'pw', label: 'New master password', type: 'password', required: true, generate: true, meter: true, autocomplete: 'new-password'},
    {name: 'pw2', label: 'Repeat', type: 'password', required: true, autocomplete: 'new-password'},
    {name: 'key', label: 'Key file', type: 'keyfile', hint: 'None = password only. ' + KEYFILE_HINT, generate: () => S.name}],
    {ok: 'Change', note: 'The vault is saved with the new master key right away. Earlier S3 versions keep the old one.',
     validate: async v => {
       if (!(await Vault.isMasterKey(S.db, v.old, v.oldkey))) return 'The current master password (or key file) is wrong';
       if (v.pw !== v.pw2) return 'The passwords do not match';
       await Vault.setMasterKey(S.db, v.pw, v.key); done = true;
     }});
  if (done) { await save(); if (S && !S.conflict && !S.error) toast('Master key changed'); }
}

function copyField(which) {
  if (!S || !S.entry) return;
  const f = Vault.fields(S.entry);
  copy(which === 'password' ? f.password : f.username, which === 'password' ? 'Password' : 'User name');
}

$('#search').addEventListener('input', e => { if (S) { S.search = e.target.value; renderVault(); pane('list'); } });

// keyboard, as in KeePassXC: ⌘F search, ⌘B copy user, ⌘C copy password, ⌘L lock, ↑/↓ move, Enter edit, Del delete
document.addEventListener('keydown', e => {
  if (!S || dialogOpen()) return;
  const mod = e.metaKey || e.ctrlKey, k = e.key.toLowerCase();
  const typing = /^(INPUT|TEXTAREA)$/.test(document.activeElement.tagName);
  if (mod && k === 'f') { e.preventDefault(); $('#search').focus(); $('#search').select(); }
  else if (mod && k === 'l') { e.preventDefault(); lock(); }
  else if (mod && k === 'b' && S.entry) { e.preventDefault(); copyField('username'); }
  else if (mod && k === 'c' && S.entry && !typing && !String(getSelection())) { e.preventDefault(); copyField('password'); }
  else if (e.key === 'Escape' && document.activeElement === $('#search')) { $('#search').value = ''; S.search = ''; $('#search').blur(); renderVault(); }
  else if (typing || mod) return;
  else if (e.key === 'ArrowDown' || e.key === 'ArrowUp') {
    const list = visibleEntries(); if (!list.length) return;
    e.preventDefault();
    const i = list.indexOf(S.entry);
    S.entry = list[Math.max(0, Math.min(list.length - 1, i + (e.key === 'ArrowDown' ? 1 : -1)))]; renderVault();
  }
  else if (e.key === 'Enter' && S.entry && !S.conflict) entryDialog(S.entry);
  else if ((e.key === 'Delete' || e.key === 'Backspace') && S.entry && !S.conflict) deleteEntry(S.entry);
});
addEventListener('beforeunload', e => { if (S && (saving || S.error || S.conflict)) { e.preventDefault(); e.returnValue = ''; } });

showHome();
</script>
</body>
</html>
